name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3000
      AI_PROVIDER: demo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrate
        run: pnpm db:migrate
      - name: Start the built app
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > app.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 1; done
      - name: End-to-end smoke test
        run: bash scripts/smoke.sh
      - name: App log on failure
        if: failure()
        run: tail -100 app.log || true

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          tags: app-migrate:ci
          cache-from: type=gha
